# Hozpitality AI (V6 + AI Search chat) behind nginx.
# Include inside the llm.hozpitality.com `server { ... }` block.
# Rate-limit zones must be declared at the http{} level (see bottom).

# --- Existing Vanna/V6 WebSocket (unchanged) -------------------------------
location /api/vanna/v2/chat_websocket {
    proxy_pass http://127.0.0.1:8085;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# --- AI Search chat WebSocket (streaming answers) ----------------------------
location = /chat/ws {
    limit_req zone=ai_chat burst=20 nodelay;
    proxy_pass http://127.0.0.1:8085;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Idle sockets are closed after 10 minutes; one answer is bounded by
    # OLLAMA_TIMEOUT_SECONDS on the server.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
}

# --- AI Search chat HTTP + SSE -----------------------------------------------
location /chat {
    limit_req zone=ai_chat burst=20 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8085;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    # /chat/stream is Server-Sent Events.
    proxy_buffering off;
    proxy_read_timeout 120s;
}

# --- MongoDB search API ---------------------------------------------------------
location /search {
    limit_req zone=ai_search burst=40 nodelay;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 30s;
}

# /metrics is operational data: keep it internal.
location = /metrics {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8085;
}

# --- http {} level --------------------------------------------------------------
