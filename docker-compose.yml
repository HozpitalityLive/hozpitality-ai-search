version: "3.9"

services:

  ai-search:
    build: .
    container_name: ai-search-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    runtime: nvidia
    depends_on:
      - redis
      - elasticsearch
      - ollama
    restart: always

  redis:
    image: redis:7
    container_name: ai-redis
    ports:
      - "6377:6379"
    restart: always

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: ai-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data 
    restart: always

  ollama:
    image: ollama/ollama
    container_name: ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - .:/app
      - ollama_data:/root/.ollama   
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    runtime: nvidia
    restart: always

volumes:
  ollama_data:
  esdata: