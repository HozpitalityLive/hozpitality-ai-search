version: "3.9"

services:

  ai-search:
    build: .
    container_name: ai-search-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    depends_on:
      - redis
      - elasticsearch
      - ollama
    restart: always

  redis:
    image: redis:7
    container_name: ai-redis
    ports:
      - "6377:6377"
    restart: always

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: ai-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    restart: always

  ollama:
    image: ollama/ollama
    container_name: ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - .:/app
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    restart: always